name: Сообщение об ошибке
description: Что-то в Gatewire работает не так, как ожидается.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Спасибо за сообщение! **Никогда не вставляйте настоящие токены, API-ключи и другие учётные данные** — удалите их из кода и логов.
        Об уязвимостях нужно сообщать приватно, см. SECURITY.md.

  - type: textarea
    id: description
    attributes:
      label: Описание
      description: Что произошло и что вы ожидали?
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Минимальный пример воспроизведения
      description: Самые простые эндпоинт, конфигурация и вызов, на которых воспроизводится проблема.
      render: swift
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Логи и текст ошибки
      render: text

  - type: input
    id: gatewire-version
    attributes:
      label: Версия Gatewire
      placeholder: 0.1.0
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Версия Xcode и платформа
      placeholder: Xcode 26.4, iOS 18.6 Simulator
    validations:
      required: true
