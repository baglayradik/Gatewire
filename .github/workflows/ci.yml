name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  macos:
    name: macOS (SwiftPM)
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Build
        run: swift build -Xswiftc -warnings-as-errors

      - name: Test
        run: swift test -Xswiftc -warnings-as-errors

  # README обещает поддержку Xcode 16.0+ (Swift 6.0). Проверяем пакет на самом старом Xcode 16.x,
  # который есть на раннере, без -warnings-as-errors: новые компиляторы предупреждают о другом.
  minimum-xcode:
    name: Minimum Xcode (16.x)
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Select oldest Xcode 16
        run: |
          xcode=$(ls -d /Applications/Xcode_16*.app 2>/dev/null | python3 -c '
          import re, sys
          paths = [line.strip() for line in sys.stdin if line.strip()]
          key = lambda path: [int(part) for part in re.findall(r"\d+", path.rsplit("/", 1)[-1])]
          print(min(paths, key=key) if paths else "")
          ')
          if [ -z "$xcode" ]; then
            echo "::error::На раннере нет Xcode 16.x. Доступны:"
            ls -d /Applications/Xcode*.app
            exit 1
          fi
          echo "Выбран $xcode"
          sudo xcode-select -s "$xcode"
          xcodebuild -version
          swift --version

      - name: Build
        run: swift build

      - name: Test
        run: swift test

  ios:
    name: iOS Simulator
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Pick simulator
        id: simulator
        run: |
          udid=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          print(next(d["udid"] for runtime, list_ in devices.items() if "iOS" in runtime
                     for d in list_ if d["name"].startswith("iPhone")))
          ')
          echo "udid=$udid" >> "$GITHUB_OUTPUT"

      # SWIFT_TREAT_WARNINGS_AS_ERRORS нельзя использовать с xcodebuild: он конфликтует с подавлением
      # предупреждений, которое Xcode применяет к зависимостям. Поэтому проверяем предупреждения только в коде Gatewire.
      - name: Test
        run: |
          set -o pipefail
          xcodebuild test \
            -scheme Gatewire-Package \
            -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.udid }}" \
            | tee xcodebuild.log
          ! grep -E "^$GITHUB_WORKSPACE/(Sources|Tests)/[^:]+:[0-9]+:[0-9]+: warning:" xcodebuild.log

  example:
    name: Example app
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Build
        run: |
          set -o pipefail
          xcodebuild build \
            -project Examples/GatewireDemo/GatewireDemo.xcodeproj \
            -scheme GatewireDemo \
            -destination "generic/platform=iOS Simulator" \
            CODE_SIGNING_ALLOWED=NO \
            | tee xcodebuild.log
          ! grep -E "^$GITHUB_WORKSPACE/(Sources|Examples)/[^:]+:[0-9]+:[0-9]+: warning:" xcodebuild.log

  other-platforms:
    name: Build (${{ matrix.platform }})
    runs-on: macos-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        platform: [tvOS Simulator, watchOS Simulator]
    steps:
      - uses: actions/checkout@v5

      - name: Build
        run: |
          set -o pipefail
          xcodebuild build \
            -scheme Gatewire \
            -destination "generic/platform=${{ matrix.platform }}" \
            | tee xcodebuild.log
          ! grep -E "^$GITHUB_WORKSPACE/(Sources|Tests)/[^:]+:[0-9]+:[0-9]+: warning:" xcodebuild.log
